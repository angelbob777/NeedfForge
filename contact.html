<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact Us | NeedForge</title><link rel="stylesheet" href="shared.css?v=13"><script src="auth.js"></script></head>
<body>
<nav class="site-nav"><a class="nav-brand" href="home.html"><img src="logo.jpg" alt="NeedForge logo">NeedForge</a><div class="nav-links"><a class="nav-admin" href="admin-login.html">Admin</a><a href="home.html">Home</a><a href="genealogy.html">Genealogy</a><a href="products.html">Products</a><a href="faq.html">FAQ</a><a href="contact.html">Contact Us</a><a href="payment.html">Payment</a><a class="nav-login" href="user-login.html">Login / Register</a></div></nav>
<header class="page-hero"><p class="eyebrow">We are here to help</p><h1>Contact us</h1><p>Find our company details or send the team a message.</p></header>
<main class="page-main">
  <section class="page-card"><h2>Company contact information</h2><div id="contactDetails" class="contact-details"></div></section>
  <section class="page-card"><h2>Send a message</h2><form id="contactForm"><label>Name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Message<textarea name="message" rows="5" required></textarea></label><button class="primary">Send message</button></form><p id="message" class="muted" aria-live="polite"></p></section>
</main>
<script>
  const defaults={company:"NeedForge",email:"support@needforge.example",phone:"Contact details coming soon",address:"Business address coming soon",facebook:"",instagram:"",whatsapp:""};
  const settings=Object.assign(defaults,JSON.parse(localStorage.getItem("needforgeContact")||"{}"));
  const details=document.querySelector("#contactDetails");
  details.innerHTML=`<div class="contact-grid"><p><strong>Company</strong><span>${settings.company}</span></p><p><strong>Email</strong><a href="mailto:${settings.email}">${settings.email}</a></p><p><strong>Phone</strong><span>${settings.phone}</span></p><p><strong>Address</strong><span>${settings.address}</span></p></div><div class="social-links"><strong>Follow us</strong>${settings.facebook?`<a href="${settings.facebook}" target="_blank" rel="noopener">Facebook</a>`:""}${settings.instagram?`<a href="${settings.instagram}" target="_blank" rel="noopener">Instagram</a>`:""}${settings.whatsapp?`<a href="${settings.whatsapp}" target="_blank" rel="noopener">WhatsApp</a>`:""}${!settings.facebook&&!settings.instagram&&!settings.whatsapp?"<span class=\"muted\">Social links coming soon</span>":""}</div>`;
  const contactForm=document.querySelector("#contactForm");
  contactForm.addEventListener("submit",event=>{
    event.preventDefault();
    const nextNumber=Number(localStorage.getItem("needforgeTicketNumber")||"1000")+1;
    localStorage.setItem("needforgeTicketNumber",String(nextNumber));
    const ticket=`NF-${nextNumber}`;
    const ticketData={ticket,createdAt:new Date().toISOString(),...Object.fromEntries(new FormData(contactForm))};
    const tickets=JSON.parse(localStorage.getItem("needforgeTickets")||"[]");
    tickets.push(ticketData);
    localStorage.setItem("needforgeTickets",JSON.stringify(tickets));
    document.querySelector("#message").textContent=`Message sent. Your ticket number is ${ticket}. Please keep it for follow-up.`;
    contactForm.reset();
  });
</script>
</body></html>
