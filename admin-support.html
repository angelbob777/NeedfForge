  <header class="page-hero"><p class="eyebrow">Administration</p><h1>Support and contact</h1><p>Review tickets, messages and public support information.</p></header>
  <main class="page-main">
    <section class="page-card">
      <h2>Open support ticket</h2>
      <form>
        <label>Ticket number<input type="text" value="NF-1001"></label>
        <label>Member<input type="text" placeholder="Member username or email"></label>
        <label>Message<textarea rows="5" placeholder="Add response or support update"></textarea></label>
        <label>Status<select><option>Open</option><option>In progress</option><option>Closed</option></select></label>
        <button class="primary" type="button">Save ticket update</button>
      </form>
    </section>
  </main>
