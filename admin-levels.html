    <div class="nav-links">
      <a class="nav-admin" href="admin-dashboard.html">Admin</a>

  </nav>
  <header class="page-hero"><p class="eyebrow">Administration</p><h1>Levels and cycles</h1><p>Review structure, cycle activity and placement rules.</p></header>
  <main class="page-main">
    <section class="page-card">
      <h2>Level structure</h2>
      <form>
        <label>Current level<select><option>Level 1</option><option>Level 2</option><option>Level 3</option><option>Level 4</option><option>Level 5</option><option>Level 6</option><option>Level 7</option><option>Level 8</option><option>Level 9</option><option>Level 10</option></select></label>
        <label>Highest level reached<select><option>Level 1</option><option>Level 2</option><option>Level 3</option><option>Level 4</option><option>Level 5</option><option>Level 6</option><option>Level 7</option><option>Level 8</option><option>Level 9</option><option>Level 10</option></select></label>
        <label>Cycle count<input type="number" value="10"></label>
        <label>Spots per cycle<input type="number" value="5"></label>
        <label>Cycle status<select><option>Active</option><option>Paused</option><option>Closed</option></select></label>
        <label>Notes<textarea rows="4" placeholder="Document cycle changes or admin notes"></textarea></label>
        <button class="primary" type="button">Save level update</button>
      </form>
    </section>
  </main>
