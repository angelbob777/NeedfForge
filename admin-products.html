<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Products | NeedForge</title>
  <link rel="stylesheet" href="shared.css?v=18">
  <script src="auth.js"></script>
</head>
<body>
  <nav class="site-nav">
    <a class="nav-brand" href="home.html"><img src="logo.jpg" alt="NeedForge logo">NeedForge</a>
    <div class="nav-links">
      
      <a href="admin-members.html">Members</a>
      <a href="admin-levels.html">Levels</a>
      <a href="admin-payments.html">Payments</a>
      <a href="admin-products.html">Products</a>
      <a href="admin-support.html">Support</a>
      <a href="admin-settings.html">Settings</a>
      <a href="admin-access.html">Access</a>
      <a href="index.html" data-logout="true">Logout</a>
    </div>
  </nav>
  <header class="page-hero"><p class="eyebrow">Administration</p><h1>Product management</h1><p>Add or update level products, bonus products and free resources.</p></header>
  <main class="page-main">
    <section class="page-card">
      <h2>Products</h2>
      <form>
        <label>Product group<select><option>Level 1 products</option><option>Level 2 products</option><option>Level 3 products</option><option>Level 4 products</option><option>Level 5 products</option><option>Level 6 products</option><option>Level 7 products</option><option>Level 8 products</option><option>Level 9 products</option><option>Level 10 products</option><option>Bonus products</option><option>Free products</option></select></label>
        <label>Title<input type="text" placeholder="Product title"></label>
        <label>Upload product file<input type="file" accept=".pdf,.doc,.docx,.mp3,.mp4,.mov,.avi,.jpg,.jpeg,.png,.gif,.wav,.zip,.txt,.csv" multiple></label>
        <label>Link (optional)<input type="url" placeholder="https://..."></label>
        <label>Description<textarea rows="4" placeholder="Write the product description"></textarea></label>
        <button class="primary" type="button">Save product</button>
      </form>
    </section>
  </main>
</body>
</html>
